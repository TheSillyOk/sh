name: Test get_ksuver.sh

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Test get_ksuver.sh
        run: |
          set -e

          echo "---> Official KSU tests"

          echo "-> default branch"
          ./get_ksuver.sh "tiann" "KernelSU" "_debug"

          echo "---> KSU fork tests"

          echo "-> KernelSU-Next/KernelSU-Next"
          ./get_ksuver.sh "KernelSU-Next" "KernelSU-Next" "_debug"

          echo "-> KernelSU-Next legacy"
          ./get_ksuver.sh "KernelSU-Next" "KernelSU-Next" "legacy" "_debug"

          echo "-> Anatdx/YukiSU"
          ./get_ksuver.sh "Anatdx" "YukiSU" "_debug"

          echo "-> SukiSU-Ultra/SukiSU-Ultra"
          ./get_ksuver.sh "SukiSU-Ultra" "SukiSU-Ultra" "_debug"
